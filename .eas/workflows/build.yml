name: Build

on:
  push:
    branches:
      - master

jobs:
  build_android:
    name: Build Android App
    type: build
    params:
      platform: android
      profile: production

  submit_android:
    name: Submit to Google Play Store
    needs: [build_android]
    type: submit
    params:
      profile: production
      build_id: ${{ needs.build_android.outputs.build_id }}
